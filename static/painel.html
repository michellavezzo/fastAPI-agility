<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agility - Painel Público</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#eee;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.estado-bar{position:fixed;top:0;left:0;right:0;text-align:center;padding:8px;font-size:1.4rem;font-weight:bold;text-transform:uppercase;letter-spacing:2px}
.estado-idle{background:#333;color:#999}
.estado-preparado{background:#e6a800;color:#000}
.estado-autorizado{background:#0077cc;color:#fff}
.estado-rodando{background:#c00;color:#fff;animation:pulse 1s infinite}
.estado-finalizado{background:#090;color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.top-timer{font-size:clamp(3.4rem,15vw,21rem);font-weight:bold;font-variant-numeric:tabular-nums;letter-spacing:.05em;line-height:1;margin:10px 0}
.tia-timer{font-size:clamp(1.5rem,5vw,7.5rem);color:#ccc;font-variant-numeric:tabular-nums}
.tia-label,.top-label{font-size:clamp(.9rem,2.2vw,3.2rem);color:#8a8a8a;text-transform:uppercase;letter-spacing:3px}
.info-row{display:flex;gap:40px;margin-top:20px}
.info-item{text-align:center}
.info-item .val{font-size:clamp(2rem,4.5vw,6.5rem);font-weight:bold}
.info-item .lbl{font-size:clamp(.85rem,1.7vw,2.4rem);color:#8a8a8a;text-transform:uppercase}
.faltas .val{color:#f80}
.recusas .val{color:#e44}
.competitor-info{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:8px 44px;padding:16px 24px;background:rgba(0,0,0,.7);font-size:clamp(1.05rem,2.6vw,3.6rem);color:#bbb;line-height:1.3}
.competitor-info span{color:#fff;font-weight:bold}
.hidden{display:none}
.recognition-banner{position:fixed;top:3.4rem;left:0;right:0;z-index:1;padding:10px 18px;text-align:center;background:#242424;border-bottom:2px solid #555}.recognition-banner.warning{border-color:#e6a800}.recognition-banner.primary{border-color:#0077cc}.recognition-banner.success{border-color:#28a745}.recognition-label{font-size:clamp(.95rem,2vw,2.3rem);font-weight:bold;text-transform:uppercase;letter-spacing:.08em}.recognition-countdown{font-size:clamp(2.7rem,8vw,10rem);font-weight:bold;font-variant-numeric:tabular-nums;line-height:1.05}.recognition-detail{color:#aaa;font-size:clamp(.75rem,1.3vw,1.5rem);margin-top:4px}
@media (max-width:640px){
  .estado-bar{font-size:1.05rem;letter-spacing:1px}
  .info-row{gap:24px;margin-top:12px}
  .competitor-info{gap:4px 16px;padding:10px 12px}
}
</style>
</head>
<body>

<div id="estadoBar" class="estado-bar estado-idle">Aguardando</div>

<div id="recognitionBanner" class="recognition-banner">
  <div id="recognitionLabel" class="recognition-label">Aguardando reconhecimento de pista</div>
  <div id="recognitionCountdown" class="recognition-countdown hidden">--:--</div>
  <div id="recognitionDetail" class="recognition-detail">Aguardando liberação da pista.</div>
</div>

<div class="top-label">Tempo Oficial da Prova</div>
<div id="topTimer" class="top-timer">00:00.000</div>

<div class="tia-label">Tempo de Início Autorizado</div>
<div id="tiaTimer" class="tia-timer">00:00.000</div>

<div class="info-row">
  <div class="info-item faltas"><div id="faltas" class="val">0</div><div class="lbl">Faltas</div></div>
  <div class="info-item recusas"><div id="recusas" class="val">0</div><div class="lbl">Recusas</div></div>
</div>

<div id="competitorInfo" class="competitor-info hidden">
  <div>Competidor: <span id="compNome">-</span></div>
  <div>Cão: <span id="caoNome">-</span> (<span id="caoRaca">-</span>)</div>
  <div>Colete: <span id="colete">-</span></div>
  <div>Categoria: <span id="categoria">-</span></div>
</div>

<script>
const ESTADO_LABELS = {
  idle: 'Aguardando',
  preparado: 'Preparado',
  autorizado: 'Autorizado',
  rodando: 'Em Prova',
  finalizado: 'Finalizado',
};

let lastSnapshot = null;
let lastSnapshotTime = 0;
let ws = null;
let reconnectTimer = null;
let reconnectDelay = 500;
let recognitionSnapshot = null;
let recognitionSnapshotTime = 0;
let recognitionWs = null;
let recognitionReconnectTimer = null;
let recognitionReconnectDelay = 500;

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  const ms = Math.floor((seconds - Math.floor(seconds)) * 1000);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(3,'0')}`;
}

function interpolate(base, snapshotAt) {
  if (!base) return {tia: '00:00.000', top: '00:00.000'};
  const now = performance.now();
  const elapsed = (now - snapshotAt) / 1000;
  let tia = base.tia_decorrido;
  let top = base.top_decorrido;
  if (base.estado === 'autorizado') tia += elapsed;
  if (base.estado === 'rodando') top += elapsed;
  return {tia: formatTime(tia), top: formatTime(top)};
}

function applyState(data) {
  const bar = document.getElementById('estadoBar');
  bar.className = 'estado-bar estado-' + data.estado;
  bar.textContent = ESTADO_LABELS[data.estado] || data.estado;

  document.getElementById('faltas').textContent = data.faltas;
  document.getElementById('recusas').textContent = data.recusas;

  const ci = document.getElementById('competitorInfo');
  if (data.estado !== 'idle') {
    ci.classList.remove('hidden');
    document.getElementById('compNome').textContent = data.competidor_nome || '-';
    document.getElementById('caoNome').textContent = data.cao_nome || '-';
    document.getElementById('caoRaca').textContent = data.cao_raca || '-';
    document.getElementById('colete').textContent = data.colete_competidor || '-';
    document.getElementById('categoria').textContent = (data.categoria || '') + ' ' + (data.classe || '');
  } else {
    ci.classList.add('hidden');
  }
}

function formatCountdown(seconds) {
  const total = Math.max(0, Math.ceil(seconds));
  return `${String(Math.floor(total / 60)).padStart(2,'0')}:${String(total % 60).padStart(2,'0')}`;
}

function recognitionRemaining() {
  if (!recognitionSnapshot) return null;
  const base = recognitionSnapshot.estado === 'reconhecimento'
    ? recognitionSnapshot.reconhecimento_restante
    : recognitionSnapshot.estado === 'intervalo' ? recognitionSnapshot.intervalo_restante : null;
  return typeof base === 'number' ? Math.max(0, base - (performance.now() - recognitionSnapshotTime) / 1000) : null;
}

function setRecognitionSnapshot(data, authoritative=false) {
  if (!data || (!authoritative && recognitionSnapshot && data.versao != null && recognitionSnapshot.versao != null && data.versao < recognitionSnapshot.versao)) return;
  recognitionSnapshot = data;
  recognitionSnapshotTime = performance.now();
  const labels = {aguardando:'Aguardando reconhecimento de pista', reconhecimento:'Reconhecimento de pista', intervalo:'Intervalo antes da primeira entrada', liberado:'Pista liberada'};
  const colors = {aguardando:'', reconhecimento:'warning', intervalo:'primary', liberado:'success'};
  document.getElementById('recognitionBanner').className = `recognition-banner ${colors[data.estado] || ''}`;
  document.getElementById('recognitionLabel').textContent = labels[data.estado] || data.estado;
  const active = data.estado === 'reconhecimento' || data.estado === 'intervalo';
  document.getElementById('recognitionCountdown').classList.toggle('hidden', !active);
  document.getElementById('recognitionDetail').textContent = data.estado === 'liberado'
    ? `Pista liberada para a prova #${data.id_prova}.`
    : `Fase: ${data.estado} · Prova: ${data.id_prova ?? '—'}`;
}

function setSnapshot(data) {
  if (!data) return;
  if (lastSnapshot && data.versao != null && lastSnapshot.versao != null && data.versao < lastSnapshot.versao) return;
  lastSnapshot = data;
  lastSnapshotTime = performance.now();
  applyState(data);
}

function renderFrame() {
  const vals = interpolate(lastSnapshot, lastSnapshotTime);
  document.getElementById('topTimer').textContent = vals.top;
  document.getElementById('tiaTimer').textContent = vals.tia;
  const remaining = recognitionRemaining();
  if (remaining !== null) document.getElementById('recognitionCountdown').textContent = formatCountdown(remaining);
  requestAnimationFrame(renderFrame);
}

function wsUrl(path) {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${protocol}//${location.host}${path}`;
}

function connectWebSocket() {
  if (ws) return;
  ws = new WebSocket(wsUrl('/ws/prova-ativa'));
  let awaitingAuthoritativeSnapshot = true;
  ws.onopen = () => {
    reconnectDelay = 500;
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
  };
  ws.onmessage = ev => {
    try {
      const message = JSON.parse(ev.data);
      if (message.tipo === 'estado' && message.data) {
        if (awaitingAuthoritativeSnapshot) { lastSnapshot = null; awaitingAuthoritativeSnapshot = false; }
        setSnapshot(message.data);
      }
    } catch (_) {}
  };
  ws.onclose = () => { ws = null; scheduleReconnect(); };
  ws.onerror = () => ws.close();
}

function scheduleReconnect() {
  if (reconnectTimer) return;
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connectWebSocket(); }, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 2, 5000);
}

function connectRecognitionWebSocket() {
  if (recognitionWs) return;
  recognitionWs = new WebSocket(wsUrl('/ws/reconhecimento-pista'));
  let awaitingAuthoritativeSnapshot = true;
  recognitionWs.onopen = () => { recognitionReconnectDelay = 500; clearTimeout(recognitionReconnectTimer); recognitionReconnectTimer = null; };
  recognitionWs.onmessage = ev => {
    try {
      const message = JSON.parse(ev.data);
      if (message.tipo === 'estado_reconhecimento' && message.data) {
        setRecognitionSnapshot(message.data, awaitingAuthoritativeSnapshot);
        awaitingAuthoritativeSnapshot = false;
      }
    } catch (_) {}
  };
  recognitionWs.onclose = () => { recognitionWs = null; scheduleRecognitionReconnect(); };
  recognitionWs.onerror = () => recognitionWs && recognitionWs.close();
}

function scheduleRecognitionReconnect() {
  if (recognitionReconnectTimer) return;
  recognitionReconnectTimer = setTimeout(() => { recognitionReconnectTimer = null; connectRecognitionWebSocket(); }, recognitionReconnectDelay);
  recognitionReconnectDelay = Math.min(recognitionReconnectDelay * 2, 5000);
}

requestAnimationFrame(renderFrame);
connectWebSocket();
connectRecognitionWebSocket();
</script>
</body>
</html>
